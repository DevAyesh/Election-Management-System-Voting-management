services:
  web:
    build: .
    env_file: .env
    environment:
      DEMO_RESET: ${DEMO_RESET:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./media:/app/media
    entrypoint: ["/app/docker/entrypoint.sh"]
    command: python manage.py runserver 0.0.0.0:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/voting/station/login/')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  watcher:
    build: .
    env_file: .env
    entrypoint: []
    command: python manage.py watch_chain --interval 20 --anchor-file /app/data/anchors.txt
    volumes:
      - ./data:/app/data
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
